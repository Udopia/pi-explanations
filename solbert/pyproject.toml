[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "solbert"
version = "1.0.2"
description = "SAT-based computation and enumeration of sufficient reasons for decision tree and random forest classifiers in sklearn"
readme = "../README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "numpy",
    "polars",
    "scikit-learn",
]
authors = [
    { name = "Ashlin Iser", email = "ashlin.iser@kit.edu" },
]
maintainers = [
    { name = "Ashlin Iser", email = "ashlin.iser@kit.edu" },
]

classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]

[project.urls]
Repository = "https://github.com/Udopia/solbert"
Paper = "https://github.com/Udopia/solbert/tree/main/paper2"

[project.optional-dependencies]
plot = ["matplotlib"]

[tool.scikit-build]
cmake.version = ">=3.18"
cmake.build-type = "Release"
wheel.packages = ["solbert"]
sdist.include = [
    "CMakeLists.txt",
    "../README.md",
    "lib/ipasir.h",
    "solbert/**",
    "src/**",
    "test/**",
]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-win* *_i686"
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-command = 'python -c "import solbert; from solbert.tree import DecisionTreeEncoder; from solbert.forest import RandomForestEncoder; assert solbert.compute_prime_implicants([[1]], [1]) == [[-1]]"'