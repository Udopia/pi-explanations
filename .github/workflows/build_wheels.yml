name: Build Wheels

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built distributions to PyPI
        required: false
        default: false
        type: boolean

jobs:
  # Native runners avoid QEMU and produce one portable wheel set per architecture.
  build-linux:
    strategy:
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-latest, march: x86-64 }
          - { arch: aarch64, runner: ubuntu-24.04-arm, march: armv8-a }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_LINUX: ${{ matrix.arch }}
          CIBW_BEFORE_ALL_LINUX: |
            if command -v apk >/dev/null 2>&1; then apk add --no-cache git make; elif command -v dnf >/dev/null 2>&1; then dnf install -y git make; else yum install -y git make; fi
            git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git /tmp/cadical
            cd /tmp/cadical
            CFLAGS="-fPIC -O3 -march=${{ matrix.march }}" CXXFLAGS="-fPIC -O3 -march=${{ matrix.march }}" ./configure
            make -j"$(getconf _NPROCESSORS_ONLN)"
          # Reuse one CaDiCaL build for every Python ABI and avoid host libstdc++/libgcc requirements.
          CIBW_ENVIRONMENT_LINUX: 'CMAKE_ARGS="-DSOLBERT_CADICAL_LIBRARY=/tmp/cadical/build/libcadical.a" CFLAGS="-O3 -march=${{ matrix.march }}" CXXFLAGS="-O3 -march=${{ matrix.march }}" LDFLAGS="-static-libstdc++ -static-libgcc"'
        with:
          package-dir: ./solbert
          output-dir: wheelhouse

      - name: Validate wheels
        shell: bash
        run: |
          python -m pip install --upgrade -q twine
          twine check wheelhouse/*.whl
          for wheel in wheelhouse/*.whl; do zip -T "$wheel" >/dev/null; done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.arch }}
          path: wheelhouse/*.whl

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache cibuildwheel downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/cibuildwheel
          key: cibw-macos-${{ hashFiles('solbert/pyproject.toml', 'solbert/CMakeLists.txt', '.github/workflows/build_wheels.yml') }}
          restore-keys: |
            cibw-macos-

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        env:
          CIBW_ARCHS_MACOS: arm64
          CIBW_BEFORE_ALL_MACOS: |
            git clone --depth 1 --branch rel-3.0.1 https://github.com/arminbiere/cadical.git /tmp/cadical
            cd /tmp/cadical
            CFLAGS="-fPIC -arch arm64 -mmacosx-version-min=11.0" CXXFLAGS="-fPIC -arch arm64 -mmacosx-version-min=11.0" ./configure
            make -j"$(sysctl -n hw.ncpu)"
          CIBW_ENVIRONMENT_MACOS: 'CMAKE_ARGS="-DSOLBERT_CADICAL_LIBRARY=/tmp/cadical/build/libcadical.a" MACOSX_DEPLOYMENT_TARGET="11.0"'
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        with:
          package-dir: ./solbert
          output-dir: wheelhouse

      - name: Validate wheels
        shell: bash
        run: |
          python -m pip install --upgrade -q twine
          twine check wheelhouse/*.whl
          for wheel in wheelhouse/*.whl; do zip -T "$wheel" >/dev/null; done

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-arm64
          path: wheelhouse/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build source distribution
        run: |
          python -m pip install --upgrade -q build twine
          python -m build --sdist solbert
          twine check solbert/dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: solbert/dist/*.tar.gz

  release:
    if: github.event_name == 'release' || inputs.publish
    needs: [build-linux, build-macos, build-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1