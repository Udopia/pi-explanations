name: Build-Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Solbert
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            jobs=$(sysctl -n hw.ncpu)
          else
            jobs=$(getconf _NPROCESSORS_ONLN)
          fi
          CMAKE_ARGS="-DSOLBERT_CADICAL_BUILD_JOBS=$jobs" python -m pip install ./solbert

      - name: Run API tests
        run: python solbert/test/test_solbert.py